<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAM Flyer</title>
<!--
  The printed flyer: US Letter (8.5 x 11 in), portrait, for campuses, offices
  and BART stations.

  One yellow field, one column to read, one picture. The eye goes down the
  left: the logo, the headline, the line under it, then the scan row; the
  phone stands beside the column and is the only image. Nothing else is on
  the page - no stickers, rings, highlights or arrows - on purpose.

  Everything sits inside a 0.4 in white margin, so a home or office printer
  (which cannot print the edge of the sheet) prints it whole.

  The QR box is a white square with a quiet zone: paste a code of 2 in or
  larger into it, or open flyer.html?qr-filled to hide the placeholder.

  Render with: python marketing/flyer/render.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  @page{ size:8.5in 11in; margin:0; }
  :root{ --paper:#FFFFFF; --ink:#1E1B27; --yellow:#FFD23F; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#777; }
  body{ -webkit-print-color-adjust:exact; print-color-adjust:exact;
    font-family:'Geist', system-ui, sans-serif; color:var(--ink); }
  @media print{ html,body{ background:none; height:11in; overflow:hidden; } }

  .sheet{ position:relative; width:8.5in; height:11in; overflow:hidden; margin:0; background:var(--paper); }
  @media screen{ .sheet{ margin:0.4in auto; box-shadow:0 10px 40px rgba(0,0,0,0.35); } }

  .field{ position:absolute; inset:0.4in; background:var(--yellow); border-radius:0.3in; overflow:hidden; }

  /* The logo as the app shows it: yellow FAM on its own dark tile. Spaced by
     eye, not by bounding box: the F's open lower right reads as a wider gap
     than the M's stem, so the chevron and M sit 2 units closer. */
  .badge{ position:absolute; left:0.45in; top:0.45in; background:var(--ink); border-radius:0.2in; padding:0.17in 0.26in; }
  .wordmark{ color:var(--yellow); height:0.56in; width:1.553in; display:block; overflow:visible; }

  h1{ position:absolute; left:0.45in; top:1.85in; margin:0; width:4.1in;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:800; text-transform:uppercase;
    font-size:46pt; line-height:0.9; letter-spacing:-0.025em; }

  .pitch{ position:absolute; left:0.45in; top:5.1in; width:3.9in; margin:0;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:600;
    font-size:22pt; line-height:1.15; letter-spacing:-0.01em; }

  .phone{ position:absolute; left:4.6in; top:0.95in; width:2.78in; transform:rotate(4deg);
    border-radius:0.42in; padding:0.1in; background:#0F0E12; }
  .phone img{ display:block; width:100%; height:auto; aspect-ratio:780/1627; border-radius:0.33in; }

  /* The scan row: the code and the one instruction beside it. */
  .scan{ position:absolute; left:0.45in; right:0.45in; bottom:0.45in; display:flex; align-items:center; gap:0.4in; }
  .qr{ flex:0 0 2.3in; height:2.3in; border-radius:0.16in; background:#fff; display:grid; place-items:center; }
  .qr-target{ width:2in; height:2in; border:1.5px dashed #B9B1CC; border-radius:0.06in;
    display:grid; place-items:center; text-align:center; color:#8A83A0;
    font-family:'Geist Mono', monospace; font-size:8.5pt; letter-spacing:0.14em; text-transform:uppercase; line-height:1.6; }
  .qr-target svg{ width:0.42in; height:0.42in; margin:0 auto 0.06in; display:block; color:#B9B1CC; }
  html.qr-filled .qr-target{ border:0; }
  html.qr-filled .qr-target > *{ display:none; }
  .scan-k{ font-family:'Geist Mono', monospace; font-size:10pt; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; }
  .scan h2{ font-family:'Bricolage Grotesque', sans-serif; font-weight:800; margin:0.1in 0 0;
    font-size:40pt; line-height:0.95; letter-spacing:-0.025em; }
</style>
<script>
  if (/[?&]qr-filled\b/.test(location.search)) document.documentElement.classList.add('qr-filled');
</script>
</head>
<body>
<div class="sheet">
  <div class="field">
    <div class="badge"><svg class="wordmark" viewBox="0 0 46.7 16.9" aria-label="FAM">
      <g fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(-4.55,-4.55)"><path d="M6 20V9.2A3.2 3.2 0 0 1 9.2 6H16"/><path d="M6 13h8"/></g>
        <g transform="translate(9.35,-4.55)"><path d="M5 13l7-7 7 7"/><path d="M5 20l7-7 7 7"/></g>
        <g transform="translate(27.25,-4.55)"><path d="M6 20V6l6 9 6-9v14"/></g>
      </g>
    </svg></div>

    <h1>Listen to<br>everything<br>you want<br>to know<br>about.</h1>
    <p class="pitch">One minute personalized audio episodes.</p>

    <div class="phone"><img src="player.jpg" alt="A FAM episode playing"></div>

    <div class="scan">
      <div class="qr" aria-label="QR code goes here">
        <div class="qr-target"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 17h4v4h-4z"/></svg>QR code<br>2 in &times; 2 in</div></div>
      </div>
      <div>
        <div class="scan-k">Now in early access</div>
        <h2>Scan to join<br>the waitlist.</h2>
      </div>
    </div>
  </div>
</div>
</body>
</html>
