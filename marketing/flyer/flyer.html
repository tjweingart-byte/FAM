<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAM Flyer</title>
<!--
  The printed flyer: US Letter (8.5 x 11 in), portrait, for campuses, offices
  and BART stations.

  White paper, two rows on one grid. The top row says who and what to do: the
  logo on the left, "scan to join the waitlist" and the QR code on the right.
  Below it, the words on a gold block with the phone, the only picture,
  standing half over it. Nothing else
  is on the page - no stickers, rings, highlights, arrows or background - on
  purpose.

  Everything sits inside a 0.4 in white margin, so a home or office printer
  (which cannot print the edge of the sheet) prints it whole.

  qr-waitlist.svg is generated by render.py from WAITLIST_URL there; change
  the address in that one place.

  Render with: python marketing/flyer/render.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  @page{ size:8.5in 11in; margin:0; }
  :root{ --paper:#FFFFFF; --ink:#1E1B27; --logo:#F0BF63; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#777; }
  body{ -webkit-print-color-adjust:exact; print-color-adjust:exact;
    font-family:'Geist', system-ui, sans-serif; color:var(--ink); }
  @media print{ html,body{ background:none; height:11in; overflow:hidden; } }

  .sheet{ position:relative; width:8.5in; height:11in; overflow:hidden; margin:0; background:var(--paper); }
  @media screen{ .sheet{ margin:0.4in auto; box-shadow:0 10px 40px rgba(0,0,0,0.35); } }

  /* Plain paper: the field only sets the margins the layout hangs from. */
  .field{ position:absolute; inset:0.4in; }

  /* One grid. The logo and the gold block share the left edge; the code and
     the phone share the right edge. The phone stands half over the block and
     past its top and bottom, so the words and the picture read as one unit. */

  /* ---------- top row: who, and what to do ---------- */
  .top{ position:absolute; left:0.3in; right:0.3in; top:0.42in; height:1.9in;
    display:flex; align-items:center; justify-content:space-between; }

  /* The logo on its dark tile, drawn from the owner's logo file: the path
     coordinates are that image's own pixels, so the letters' widths and the
     gaps either side of the chevron are the file's, not re-derived. */
  .badge{ background:var(--ink); border-radius:0.2in; padding:0.17in 0.26in; }
  .wordmark{ color:var(--logo); height:0.52in; width:1.863in; display:block; overflow:visible; }

  .scan{ display:flex; align-items:center; gap:0.3in; }
  .scan-words{ text-align:right; }
  .scan-k{ font-family:'Geist Mono', monospace; font-size:8.5pt; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; }
  .scan h2{ font-family:'Bricolage Grotesque', sans-serif; font-weight:800; margin:0.08in 0 0;
    font-size:25pt; line-height:0.98; letter-spacing:-0.02em; }
  /* 1.9 in box: a 1.6 in code with a white quiet zone inside the outline. */
  .qr{ width:1.9in; height:1.9in; border-radius:0.14in; border:2px solid var(--ink); background:#fff;
    display:grid; place-items:center; }
  .qr img{ display:block; width:1.6in; height:1.6in; }

  /* ---------- the words and the phone ---------- */
  /* The headline at the block's top, the line under it at the block's foot. */
  .words{ position:absolute; left:0.3in; top:3.52in; width:4.7in; height:5.45in;
    background:var(--logo); border-radius:0.2in; padding:0.42in 0.36in;
    display:flex; flex-direction:column; justify-content:space-between; }

  h1{ margin:0; width:3.3in; font-family:'Bricolage Grotesque', sans-serif; font-weight:800; text-transform:uppercase;
    font-size:37pt; line-height:0.9; letter-spacing:-0.025em; }

  .pitch{ margin:0; width:3.4in; font-family:'Bricolage Grotesque', sans-serif; font-weight:600;
    font-size:19pt; line-height:1.15; letter-spacing:-0.01em; }

  .phone{ position:absolute; left:4.2in; top:3.02in; width:3.2in;
    border-radius:0.46in; padding:0.1in; background:#0F0E12; }
  .phone img{ display:block; width:100%; height:auto; aspect-ratio:780/1627; border-radius:0.37in; }
</style>
</head>
<body>
<div class="sheet">
  <div class="field">
    <div class="top">
      <div class="badge"><svg class="wordmark" viewBox="212 357 1114 311" aria-label="FAM">
        <g fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
          <path d="M240 640V441A57 57 0 0 1 297 385H471"/><path d="M240 528H435"/>
          <path d="M628 497L750 387L872 497"/><path d="M628 640L750 531L872 640"/>
          <path d="M1040 640V385L1169 507L1300 385V640"/>
        </g>
      </svg></div>

      <div class="scan">
        <div class="scan-words">
          <div class="scan-k">Now in early access</div>
          <h2>Scan to join<br>the waitlist.</h2>
        </div>
        <div class="qr"><img src="qr-waitlist.svg" alt="QR code: the FAM waitlist"></div>
      </div>
    </div>

    <div class="words">
      <h1>Listen to<br>everything<br>you want<br>to know<br>about.</h1>
      <p class="pitch">One minute personalized<br>audio episodes.</p>
    </div>

    <div class="phone"><img src="player.jpg" alt="A FAM episode playing"></div>
  </div>
</div>
</body>
</html>
