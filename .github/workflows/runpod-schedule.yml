name: RunPod Schedule

# Start the voice in the morning and stop it at night, so a rented GPU is not
# billed while nobody is listening.
#
# ## The pod is named, never numbered
#
# This workflow used to carry the pod's **id** as a literal. An id does not
# survive a pod being replaced, so every migration silently pointed the
# schedule at a machine that no longer existed: the start did nothing, the
# stop did nothing, and the live pod ran unmanaged and unbilled-for-sleep.
# That has now happened twice - the comment explaining the first time was
# still in this file when it happened the second time (PROBLEMS.md §112,
# §116), which is the clearest possible evidence that a literal here is a
# scheduled mistake rather than a one-off one.
#
# A **name** survives: a pod destroyed and recreated from the same template
# keeps it. So the name is the setting, the id is looked up, and it is the
# *same* name `voice_control.py` uses for the `runpod-pod` rung on Render -
# one fact about the deployment, set in two places because they are two
# systems, rather than an id copied into two places and re-copied on every
# migration.
#
# Set the repository variable (Settings -> Secrets and variables -> Actions ->
# Variables):
#
#     RUNPOD_POD = <the pod's name, e.g. fam-voice>
#
# `RUNPOD_POD_ID` is still read as a fallback for a deployment that has only
# an id. Neither set, or a name that matches nothing, **fails the run** rather
# than exiting quietly: a schedule that does nothing looks exactly like a
# schedule that worked, which is the whole of the bug above.

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 23 * * *'
      timezone: 'America/Los_Angeles'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose what to do'
        required: true
        type: choice
        options:
          - start
          - stop

jobs:
  manage-runpod:
    runs-on: ubuntu-latest

    steps:
      - name: Decide what to do
        id: plan
        env:
          MANUAL_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="$MANUAL_ACTION"
          else
            HOUR=$(TZ=America/Los_Angeles date +%H)
            if [ "$HOUR" = "08" ]; then
              ACTION="start"
            elif [ "$HOUR" = "23" ]; then
              ACTION="stop"
            else
              echo "No action required at hour $HOUR."
              echo "action=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      # Resolved every run, so a replaced pod is picked up without anybody
      # editing this file. The lookup is the same REST API voice_control.py
      # asks, with the same key.
      - name: Find the pod
        id: find
        if: steps.plan.outputs.action != 'none'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_NAME: ${{ vars.RUNPOD_POD }}
          POD_ID: ${{ vars.RUNPOD_POD_ID }}
        run: |
          set -euo pipefail
          if [ -z "${POD_NAME}${POD_ID}" ]; then
            echo "::error::Neither the RUNPOD_POD (name) nor RUNPOD_POD_ID repository variable is set, so this schedule does not know which pod to manage. Set RUNPOD_POD to the pod's name - the same name Render uses for the runpod-pod rung."
            exit 1
          fi

          PODS=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/pods")

          # Name first, id second. `.pods // .` because RunPod has answered
          # both a bare list and an object wrapping one.
          RESOLVED=$(printf '%s' "$PODS" | jq -r --arg name "$POD_NAME" --arg id "$POD_ID" '
            (if type == "object" then (.pods // []) else . end)
            | map(select((($name != "") and (.name == $name))
                         or (($id != "") and (.id == $id))))
            | .[0].id // ""')

          if [ -z "$RESOLVED" ]; then
            echo "::error::RunPod lists no pod named '${POD_NAME}' or with id '${POD_ID}'. It was probably replaced; update the RUNPOD_POD variable to the current pod's name. Pods on this account:"
            printf '%s' "$PODS" | jq -r '(if type == "object" then (.pods // []) else . end) | .[] | "  \(.name)  \(.id)  \(.desiredStatus // .status // "?")"' || true
            exit 1
          fi

          NAME=$(printf '%s' "$PODS" | jq -r --arg rid "$RESOLVED" '
            (if type == "object" then (.pods // []) else . end)
            | map(select(.id == $rid)) | .[0].name // "?"')
          echo "Resolved pod '${NAME}' to id ${RESOLVED}"
          echo "id=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Start or stop the pod
        if: steps.plan.outputs.action != 'none'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ACTION: ${{ steps.plan.outputs.action }}
          POD_ID: ${{ steps.find.outputs.id }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            start|stop) ;;
            *) echo "::error::Unknown action: $ACTION"; exit 1 ;;
          esac
          echo "${ACTION}ing pod $POD_ID..."
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            "https://rest.runpod.io/v1/pods/$POD_ID/$ACTION"
