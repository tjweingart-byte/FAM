name: Voice worker

# The other half of PROBLEMS.md §112. The app can now find a worker wherever
# RunPod puts it; this is about the step before that - getting a *correct*
# worker image built and published without anybody running docker by hand.
#
# Two jobs, deliberately different in cost:
#
#   contract  every push that touches the worker. Seconds, no GPU, no
#             registry: it checks that the two halves still agree about the
#             wire contract, which is the failure that cannot be seen from
#             either side alone because they are deployed separately.
#   image     builds Dockerfile.voice and pushes it to GHCR, tagged with the
#             commit. Opt-in, because a CUDA image is ~10 GB and a runner is
#             not obliged to have the disk - set the repository variable
#             BUILD_VOICE_IMAGE=true, or run it by hand from the Actions tab.
#
# What it deliberately does NOT do: deploy. Nothing here restarts a pod or
# changes an endpoint, because a workflow that can replace the running voice
# on a push is a workflow that can take the voice down on a typo. The pod's
# template points at `:latest` or at a tag, and rolling it is one click in a
# console by somebody who meant to.

on:
  push:
    paths:
      - "voice_worker/**"
      - "Dockerfile.voice"
      - "tts.py"
      - "voice_control.py"
      - "remote_voice.py"
      - "requirements-chatterbox.txt"
      - "requirements-voice-worker.txt"
      - ".github/workflows/voice-worker.yml"
  pull_request:
    paths:
      - "voice_worker/**"
      - "Dockerfile.voice"
      - "remote_voice.py"
      - "voice_control.py"
  workflow_dispatch:

concurrency:
  group: voice-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # The tests that are about the seam rather than about the app. Run on
      # their own as well as inside the full suite, so a change to the worker
      # gets an answer in under a minute.
      - name: The two halves still agree
        run: |
          python -m pytest tests/test_remote_voice.py tests/test_voice_control.py \
            tests/test_voice_registry.py tests/test_voice_registration_endpoint.py \
            tests/test_voice_worker_registration.py -q

      # The image runs `python -m uvicorn voice_worker.server:app`, so an
      # import error in it is a container that starts and answers nothing -
      # which arrives at the app as a 404 and reads like a missing route.
      - name: The worker's entrypoints import
        run: |
          pip install fastapi uvicorn
          python -c "import voice_worker.server; import voice_worker.register; \
                     print('serves', sorted(r.path for r in voice_worker.server.app.routes))"

  image:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.BUILD_VOICE_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA base plus torch does not fit beside everything a runner ships
      # with. This is the difference between a build that works and one that
      # fails at 90% with "no space left on device".
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.voice
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fam-voice:${{ github.sha }}
            ghcr.io/${{ github.repository }}/fam-voice:latest
          # Stamped into the image so the running worker can say which build
          # it is, and `/api/health` on the app can say whether the fix that
          # was pushed is the fix that is speaking (§77 across the split).
          build-args: |
            VOICE_IMAGE=ghcr.io/${{ github.repository }}/fam-voice:${{ github.sha }}
            FAM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to do with it
        run: |
          echo "Pushed ghcr.io/${{ github.repository }}/fam-voice:${{ github.sha }}"
          echo "Point the RunPod template at it, then check the app with:"
          echo "  python tools/voice_doctor.py --speak"
