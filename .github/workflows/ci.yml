name: CI

# Every push and PR. The point is that a broken build is caught here rather
# than on a phone: the loop is only fast if the thing you open already works.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # No API key and no speech engine: the suite is designed to run without
      # either, and a test that needs them is a test that cannot run here.
      - name: Tests
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The interface is one large HTML file with inline script. A syntax
      # error in it is invisible to pytest and fatal on a phone.
      - name: Check the interface parses
        run: python tools/check_js.py

      # Changing speed must not change the voice. `dev.sh` runs this locally;
      # without it here the guard is only enforced on machines that happen to
      # have node, which is the sort of check that is quietly not running.
      - name: Check speed leaves the voice alone
        run: node tools/check_stretch.js

      # Deleting a block of CSS breaks nothing that fails - the page just
      # looks wrong. This has happened twice; it now fails here instead.
      - name: Check the interface is styled
        run: python tools/check_css.py

      - name: Build the phone preview
        run: python preview/build_preview.py

      # The other preview, and the one that is actually published. It is built
      # from the same interface by a different script and carries its own copy
      # of things that must stay in step with the code - `topics.SECTIONS`
      # among them - so a change can leave the fixture build green and the
      # published one wrong. `dev.sh` has built both for a while; CI did not,
      # which is PROBLEMS.md §101's finding ("a check added to the local loop
      # is not added to the gate") with a different file in it.
      - name: Build the live phone preview
        run: python preview/build_live_preview.py

      # Drives the built preview in a real browser with no server at all:
      # every tab, and audio actually advancing. This is the check that would
      # have caught the reel bugs. Both builds are driven, because both ship.
      - name: Smoke test the previews
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/smoke_preview.py
          python tools/smoke_preview.py preview/fam-live.html

      - name: Keep the preview build
        uses: actions/upload-artifact@v4
        with:
          name: fam-preview
          path: |
            preview/fam-preview.html
            preview/fam-artifact.html
            preview/fam-live-artifact.html
          retention-days: 30
