# One-command deploy: `render blueprint launch` (or point Render at this repo
# and it reads this file). Chosen because it deploys from a Dockerfile, gives
# a persistent disk on the paid tier, and redeploys on every push - which is
# the part that matters for a fast loop.
#
# Two services from one blueprint (STAGING.md, PROBLEMS.md §172):
#
#   fam           production. Follows `Main`. What listeners - and, once it
#                 ships, the App Store build - talk to.
#   fam-staging   staging. Follows `staging`. Every merge lands here first and
#                 is tried before `staging` is merged into `Main` in a batch.
#                 **Zero spend**: it is given no paid key at all, and
#                 `FAM_ENV=staging` removes any that reach it anyway and stops
#                 every outbound connection (spend_guard.py). Episodes are the
#                 built-in sample script in a placeholder tone; real ones are
#                 replayed from production with tools/replay_episodes.py.
#
# Both must be created *from this file* (Blueprints -> New, or `render
# blueprint launch`): a service made by hand in the dashboard gets no disk, and
# every deploy then erases its accounts (DEPLOY.md). Nothing is shared between
# them - not a disk, not a key, not an admin token, not a voice worker.
services:
  - type: web
    name: fam-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: staging
    plan: starter
    autoDeploy: true       # every merge into `staging` is on it within minutes
    healthCheckPath: /api/health
    envVars:
      # The whole of zero spend is this line. It cannot be switched off by
      # another variable, and it ignores FAM_SECRETS: a secrets manager is
      # where the paid keys live.
      - key: FAM_ENV
        value: staging
      # The network guard patches Python's socket, and uvloop - which uvicorn
      # picks by itself when installed - connects round it. Health reports
      # `network_guard: false` if this is ever missing.
      - key: UVICORN_LOOP
        value: asyncio
      # Its own admins and its own token: staging's admin page reads staging's
      # stores, and a token that opened both would open production from a
      # page people test on. Needed for tools/replay_episodes.py --to.
      - key: FAM_ADMIN_ACCOUNTS
        sync: false
      - key: FAM_ADMIN_TOKEN
        sync: false
      # Deliberately absent: ANTHROPIC_API_KEY, EXA_API_KEY, GNEWS_KEY,
      # API_SPORTS_KEY, FINNHUB_KEY, GEMINI_API_KEY, RUNPOD_*, GDELT,
      # STORIES_POLYMARKET, LIVE_*_PROVIDER, FAM_SECRETS. Adding one here does
      # nothing (spend_guard removes it and health lists it under
      # `credentials_removed`), so do not.
    disk:
      name: fam-staging-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: fam
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: Main
    plan: starter          # free tier sleeps; starter stays warm
    # Every merge into `Main` redeploys. Turn this off once the app is in the
    # App Store and deploy production deliberately (STAGING.md).
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: FAM_ENV
        value: production
      # Two ways to do this, and the second one scales past this service.
      #
      # `sync: false` means Render asks for the value once in the dashboard and
      # keeps it - never in the repo. That is fine here, and it is a snapshot:
      # rotating the key means editing it here and redeploying.
      #
      # FAM_SECRETS instead points the app at a secrets manager it can read for
      # itself, which is not a secret and so could live in this file. A rotated
      # key is then picked up by the running server. See CREDENTIALS.md.
      - key: ANTHROPIC_API_KEY
        sync: false        # set once in the dashboard; never in the repo
      # No DEMO_MODE here: nothing reads it. Demo mode is derived from whether
      # a Claude key is present (§208 removed a `DEMO_MODE=0` that did nothing).
      # Tier quotas, enforced here and nowhere else (§207): the free tier's
      # daily ceiling bounds what one listener can spend (~$0.50 a day rather
      # than ~$2 a minute). Admin accounts (FAM_ADMIN_ACCOUNTS) are unlimited;
      # POST /api/admin/plan moves anyone else. FREE_EPISODES_PER_DAY and
      # FREE_EXPLORE_PER_DAY tune the ceiling in the dashboard.
      - key: ENFORCE_QUOTAS
        value: "1"
      # The pre-launch waitlist (WAITLIST.md). WAITLIST=1 closes the app to
      # anybody whose account is not active, so it is asked for in the
      # dashboard rather than set here: turning it on is a decision made when
      # the waitlist page has been seen working, not a side effect of a merge.
      - key: WAITLIST
        sync: false
      - key: VIRAL_LOOPS_CAMPAIGN_ID
        sync: false
      - key: VIRAL_LOOPS_API_TOKEN
        sync: false
      # Who may open /admin, the live tracker (admin_tracker.py): the email,
      # phone or listener id of each admin account, comma separated. Asked
      # for here because nothing else prompts for it, and unset means nobody
      # is an admin by account and /admin 404s unless FAM_ADMIN_TOKEN is set.
      - key: FAM_ADMIN_ACCOUNTS
        sync: false
      # Tile pictures (THUMBNAILS.md, §160): the Google AI Studio key the image
      # model is billed on. Unset, nothing is painted and every tile draws its old
      # icon; /api/health says which. THUMBNAILS=1 then paints new branches of
      # the category tree in the background, inside a daily ceiling.
      - key: GEMINI_API_KEY
        sync: false
      - key: THUMBNAILS
        value: "0"
      - key: MODEL
        value: claude-sonnet-5
      # --- The voice ----------------------------------------------------
      #
      # Render has no GPU, so this service cannot speak by itself: with the
      # default backend it reports `interim: true` and plays a placeholder
      # tone. `remote` points it at Chatterbox on a RunPod worker, which is
      # what makes a CPU host a complete deployment rather than a mute one.
      #
      # The two halves are deployed independently on purpose. Switching this
      # service between a serverless endpoint and an always-on pod - or back
      # to an in-process card on GPU hosting - is these variables and nothing
      # else. See REMOTE_VOICE.md.
      - key: VOICE_BACKEND
        value: remote
      - key: REMOTE_VOICE_TRANSPORT
        value: runpod      # runpod (sleeps when idle) | http (always-on pod)
      # The endpoint id from the RunPod console. Not a secret, but it names
      # *your* endpoint, so it is asked for rather than committed.
      - key: RUNPOD_ENDPOINT_ID
        sync: false
      # Authorises a job on it. Same handling as the Anthropic key: the
      # dashboard, or FAM_SECRETS. Never in this file.
      - key: RUNPOD_API_KEY
        sync: false
      # Chatterbox's rate. It has to be right before the first request: the
      # stream header is written from it before any audio exists, and the
      # engine refuses a worker that answers at a different rate rather than
      # playing it at the wrong pitch.
      - key: REMOTE_VOICE_SAMPLE_RATE
        value: "24000"
      # Covers a cold worker: container boot, a ~10s model load, then the
      # synthesis. A warm one answers a chunk in a couple of seconds.
      - key: REMOTE_VOICE_TIMEOUT
        value: "180.0"
      # --- Finding the worker when RunPod moves it ----------------------
      #
      # The address of a rented GPU is not a constant, and an app holding a
      # stale one fails with a 404 in the middle of an episode. These three
      # are what stop that being a human's job (PROBLEMS.md §112).
      #
      # The pod to look for through RunPod's API, by **name**: a pod that is
      # destroyed and recreated from the same template keeps its name and
      # loses its id. Uses RUNPOD_API_KEY, which is already set above.
      - key: RUNPOD_POD
        sync: false
      # The secret a worker presents to say where it is. Set the same value
      # here and on the pod (with FAM_APP_URL pointing at this service) and a
      # replaced pod is back in service within one heartbeat, with nothing
      # edited. Unset means registration is refused, which is the safe
      # default: an open registration endpoint redirects every script this
      # app writes.
      - key: VOICE_REGISTRY_TOKEN
        sync: false
      # Which port the *worker* listens on inside the pod.
      #
      # It matters only on the discovery rungs, and only on a pod that runs
      # more than the voice - which this project's does: FAM on 8001, and
      # Chatterbox on 8002. RunPod's proxy fronts one private port and the
      # TCP mapping publishes one private port, so both rungs have to be
      # told which one, and the default (8001) is the app's own on a pod
      # running both. Left unset there, FAM discovers its own front door and
      # health-checks it (PROBLEMS.md §120).
      #
      # A worker that registers itself needs none of this: it announces the
      # port it is actually listening on, which is the only place that fact
      # is known rather than declared. This is the fallback for a pod that
      # cannot reach this service.
      - key: VOICE_WORKER_PORT
        value: "8002"
      # Where the registry of self-registered workers lives. On the disk, like
      # every other database: a redeploy must not cost the address of a pod
      # that is up and working.
      - key: VOICE_REGISTRY_DB
        value: /data/voice_registry.db
      # The bank of voices (§147): the reference recordings and each
      # listener's chosen search voice. On the disk, so a redeploy keeps them.
      - key: VOICE_BANK_DB
        value: /data/voice_bank.db
      # Whether a worker may be reached over plain HTTP.
      #
      # Off here, and it is the line to read first when a pod is healthy in a
      # browser and unreachable from this service. RunPod's proxy URL is the
      # only TLS address a pod has, and that proxy is Cloudflare: it serves a
      # browser and refuses a server, so the same /health is 200 in a tab and
      # 403 from Render with nothing wrong on either machine (PROBLEMS.md
      # §117). The way out is the pod's direct TCP port, which has no
      # certificate - so reaching it is a deliberate trade, made here.
      #
      # Set it to 1 *and* expose the worker's port as a TCP port on the pod,
      # and the direct address is found through RUNPOD_POD above or announced
      # by the worker itself. Leave it at 0 on a deployment whose worker is
      # reached some other way.
      - key: VOICE_ALLOW_PLAIN_HTTP
        value: "0"
      # --- Live facts: elections ----------------------------------------
      #
      # Polymarket. Keyless, so it is a plain `value` rather than a
      # `sync: false` prompt - there is no credential to keep out of the repo,
      # which makes it the cheapest live provider to run and the only one that
      # can be switched on from this file alone.
      #
      # POLYMARKET_BASE is deliberately NOT here. config.py already defaults it
      # to https://gamma-api.polymarket.com, and PROBLEMS.md §54 is what
      # happens when a second file repeats a setting the code already decides:
      # the copy drifts, and the deployment quietly runs against something the
      # spec never chose. Set it here only to point at a different host.
      #
      # What this buys and what it does not: election *interest*, never
      # election *results*. Every fact comes back status=unknown and
      # kind=prediction-market, and PROBLEMS.md §93 is why a forecast is told
      # the articles outrank it. Results need AP or DDHQ, both sales-gated.
      - key: LIVE_ELECTIONS_PROVIDER
        value: polymarket
      # And Polymarket's most-traded markets as story-pool signals, so the
      # Trending row is ranked across every source FAM reads (§135). Off by
      # default in config.py, on here: this deployment is the one that uses
      # all five.
      - key: STORIES_POLYMARKET
        value: "1"
      # --- Where an episode's information comes from (§135) ----------------
      #
      # Exa, GDELT, API-Sports, Finnhub and Polymarket, and nothing else: the
      # model never searches the web for FAM. The three with credentials are
      # asked for once in the dashboard. A key is also the switch - with
      # API_SPORTS_KEY set, sports questions get live scores, and the story
      # pool sweeps only the followed leagues (story_sources.SWEPT_LEAGUES),
      # only while one of their games is on and myFAM was drawn recently
      # (§191) - every other league is looked up on demand; with FINNHUB_KEY
      # set, markets are swept every 2h. Neither needs a second line naming
      # its provider.
      - key: EXA_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: FINNHUB_KEY
        sync: false
      # Weather and place names outside what NWS covers (§194): Open-Meteo's
      # API Standard plan, $29/month to 1M calls. NWS needs no key. Never on
      # staging, which scrubs it.
      - key: OPEN_METEO_API_KEY
        sync: false
      # Trending's source (§139). Trending is an edition now, built at 05:00
      # and 17:00 Eastern for every listener with its ten episodes written
      # ahead of the tap, and GNews is the only thing it is built from - no
      # fallback source, and never the live pool. Unset, Trending is empty and
      # says so. Set the ceiling to the plan: 90 fits the free tier's
      # 100/day, 900 fits Essential.
      - key: GNEWS_KEY
        sync: false
      - key: GNEWS_DAILY_REQUESTS
        value: "90"
      # Which plan was bought on each provider's own dashboard (§207). The
      # free plans of GNews and Finnhub are not licensed for commercial use,
      # and /admin and /api/health flag them in red until these say a paid
      # one: GNEWS_PLAN=essential (then GNEWS_DAILY_REQUESTS=950 and
      # GNEWS_MAX_ARTICLES=25), FINNHUB_PLAN=commercial. Unset means free.
      - key: GNEWS_PLAN
        sync: false
      - key: FINNHUB_PLAN
        sync: false
      # The live story pool's news source - what Made for you and What you
      # missed draw on (Trending is GNews since §139, above). GDELT is keyless
      # and measures what worldwide news is covering, including which
      # countries the coverage comes from. `python tools/stories_report.py`
      # against the running service is what says it is actually answering.
      - key: GDELT
        value: "1"
      # GDELT counts requests per address, and Render's outbound address is
      # shared: on 1/10 every request failed (§191). A static-IP proxy's URL
      # here (QuotaGuard Static, ~$19/mo) sends GDELT's requests - and only
      # GDELT's - from an address of FAM's own (§207). Unset, the breaker
      # stops asking after 5 failures in a row and says so on /api/health.
      - key: GDELT_PROXY_URL
        sync: false
      #
      # ANSWER_FIRST is not here because it no longer exists: the
      # from-knowledge cover it switched on was deleted in §108 (see DEPLOY.md
      # and Dockerfile.gpu). Setting it does nothing.
    disk:
      name: fam-data
      mountPath: /data     # matches the Dockerfile's CACHE_PATH etc.
      sizeGB: 1
