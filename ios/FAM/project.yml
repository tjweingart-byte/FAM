# The FAM iOS app (IOS_APP.md stage 4) as an XcodeGen spec.
#
#   cd ios/FAM && xcodegen && open FAM.xcodeproj
#
# The .xcodeproj is generated, so it is not committed: this file is the
# project. The team is chosen once in Xcode (Signing & Capabilities).
name: FAM
options:
  bundleIdPrefix: net.familiarize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FAMSafety:
    path: ../FAMSafety
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # Every upload needs a higher number; the spike used 1.
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  FAM:
    type: application
    platform: iOS
    sources:
      - path: FAM
    dependencies:
      - package: FAMSafety
    info:
      path: FAM/Info.plist
      properties:
        CFBundleDisplayName: FAM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.familiarize.fam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
