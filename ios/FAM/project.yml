# The FAM iOS app (IOS_APP.md stage 4) as an XcodeGen spec.
#
#   cd ios/FAM && xcodegen && open FAM.xcodeproj
#
# The .xcodeproj is generated, so it is not committed: this file is the
# project. The team is chosen once in Xcode (Signing & Capabilities).
name: FAM
options:
  bundleIdPrefix: net.familiarize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FAMSafety:
    path: ../FAMSafety
  # Google's own sign-in for iOS: the system browser sheet and the token.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # Every upload needs a higher number; the spike used 1.
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Apali, LLC (developer.apple.com > Membership), so a regenerated
    # project keeps its team.
    DEVELOPMENT_TEAM: 484A7YD2S3
    # Google sign-in: the iOS OAuth client made in Google Cloud for
    # net.familiarize.fam, and the same id reversed (its URL scheme). Until
    # they are set the Google button is not drawn (`no-dead-controls`).
    # The client id also belongs in the server's GOOGLE_CLIENT_IDS.
    GOOGLE_IOS_CLIENT_ID: 1051916637197-u6bh2tjrdt38p8t3d5f2tmq3o3rii5co.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1051916637197-u6bh2tjrdt38p8t3d5f2tmq3o3rii5co
targets:
  FAM:
    type: application
    platform: iOS
    sources:
      - path: FAM
    dependencies:
      - package: FAMSafety
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    # Sign in with Apple (App Store 4.8).
    entitlements:
      path: FAM/FAM.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: FAM/Info.plist
      properties:
        CFBundleDisplayName: FAM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # A group chat's "Take a photo" (the web's camera source).
        NSCameraUsageDescription: FAM uses the camera only when you take a photo for your profile or a group chat.
        # searchFAM's mic (§151): only while voice search is open, never in
        # the background ("Hey FAM" is not on iOS 1.0).
        NSMicrophoneUsageDescription: FAM listens only while voice search is open, to turn what you say into a search.
        NSSpeechRecognitionUsageDescription: FAM turns what you say into the words of your search. On phones that can, this happens on the phone; otherwise Apple's speech recognition does it. Only the finished question is sent to FAM.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # The web's three typefaces (`typefaces`), as static instances of
        # the Google Fonts variable files (OFL; licences in FAM/Fonts).
        UIAppFonts:
          - BricolageGrotesque-Regular.ttf
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.familiarize.fam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
